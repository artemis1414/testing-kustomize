apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

namePrefix: prod-
images:
  - name: nginx
    newTag: stable
replicas:
- name: nginx
  count: 5

replacements:
- source:
    kind: Service
    name: nginx
  targets:
  - select:
      kind: Deployment
      name: nginx
    fieldPaths:
    - spec.template.spec.containers.*.env.[name=DB_HOST].value

patches:
- path: sidecar-patch.yaml

